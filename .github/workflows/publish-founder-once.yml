name: Publish approved founder update once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-founder-once.yml']
permissions:
  contents: write
concurrency:
  group: founder-publication-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'shereefelibiary-tech/riskcontinuum-landing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the approved portrait and exact founder wording
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
          PHOTO_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-7fd8-81f6-992b-828e2d97ac55/raw?se=2026-10-12T00%3A38%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=cce4cecb-3055-5367-be1b-b2429ba7b3a9&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T23%3A55%3A48Z&ske=2026-10-12T23%3A55%3A48Z&sks=b&skv=2026-02-06&sig=npmCQJrxLqEoCaFsGMtW5dGtt34xoCGgcmTFqmb26R4%3D'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, struct, urllib.request

          repo = os.environ['REPO']
          expected_head = os.environ['EXPECTED_HEAD']
          api_root = 'https://api.github.com/repos/' + repo

          def api(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              request = urllib.request.Request(
                  api_root + path, data=body,
                  method=method or ('GET' if data is None else 'POST'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'RCCKM-founder-publication',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          head = api('/git/ref/heads/main')['object']['sha']
          assert head == expected_head, 'Main changed; stop rather than overwrite other work.'
          entry = api('/contents/index.html?ref=' + expected_head)
          assert entry['sha'] == 'b9d28469e0ca468b7ad2b4ae1278891fdd857e01', 'Unexpected index revision.'
          original = base64.b64decode(entry['content']).decode('utf-8')
          match = re.search(r'<!-- MEET THE FOUNDER -->\s*<section\b[^>]*\bid="founder"[\s\S]*?</section>', original)
          assert match is not None, 'Founder section not found.'
          old_section = match.group(0)
          assert old_section.count('class="founder-image"') == 1

          paragraphs = [
              'We are at a remarkable moment in medicine. Advances in technology, treatments, and clinical evidence are opening new possibilities for prevention. Our patients’ records hold valuable information about their health and how it is changing. The opportunity now is to bring it all together, efficiently and meaningfully, at the point of care and beyond.',
              'After nearly two decades caring for patients across primary care, hospital medicine, and population health, I built Risk Continuum CKM to help put that opportunity into practice. RCCKM connects a patient’s history, clinical findings, and trends with relevant evidence, helping clinicians see the whole picture and turn that understanding into an individualized approach to prevention.',
              'My goal is to make comprehensive prevention easier to deliver in everyday practice. By bringing the information and evidence together, we can support clinician judgment, strengthen conversations with patients, and extend our attention from today’s decisions to long-term health.',
          ]
          bio = '<div class="founder-bio">\n' + ''.join('        <p>' + p + '</p>\n' for p in paragraphs) + '      </div>'
          revised_section, count = re.subn(r'<div class="founder-bio">[\s\S]*?</div>', lambda m: bio, old_section, count=1)
          assert count == 1
          revised_section, count = re.subn(r'\n[ \t]*<blockquote class="founder-quote">[\s\S]*?</blockquote>', '', revised_section, count=1)
          assert count == 1
          old_image = 'src="/assets/founder-shereef.webp" width="480" height="600"'
          new_image = 'src="/assets/founder-shereef-approved.png" width="1122" height="1402"'
          assert old_image in revised_section
          revised_section = revised_section.replace(old_image, new_image, 1)
          revised = original[:match.start()] + revised_section + original[match.end():]
          assert revised.count('id="founder"') == 1
          assert all(p in revised for p in paragraphs)
          assert '/assets/founder-shereef.webp' not in revised
          assert 'Reconcile. Curate. Care.' in revised_section
          assert 'Built by a physician. Grounded in clinical practice.' in revised_section
          assert revised[:match.start()] == original[:match.start()]
          assert revised[match.start() + len(revised_section):] == original[match.end():]

          request = urllib.request.Request(os.environ['PHOTO_URL'], headers={'User-Agent': 'RCCKM-founder-publication'})
          with urllib.request.urlopen(request, timeout=60) as response:
              photo = response.read(4_000_001)
          assert len(photo) == 1940511, 'Unexpected photo size.'
          assert blob_sha(photo) == 'e0e5136b7db79cee112566334fa293b94018da91', 'Photo does not match the approved original.'
          assert photo[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', photo[16:24]) == (1122, 1402)

          image_sha = api('/git/blobs', {'content': base64.b64encode(photo).decode('ascii'), 'encoding': 'base64'})['sha']
          assert image_sha == blob_sha(photo)
          html_bytes = revised.encode('utf-8')
          html_sha = api('/git/blobs', {'content': revised, 'encoding': 'utf-8'})['sha']
          assert html_sha == blob_sha(html_bytes)
          parent = api('/git/commits/' + expected_head)
          tree_sha = api('/git/trees', {
              'base_tree': parent['tree']['sha'],
              'tree': [
                  {'path': 'index.html', 'mode': '100644', 'type': 'blob', 'sha': html_sha},
                  {'path': 'assets/founder-shereef-approved.png', 'mode': '100644', 'type': 'blob', 'sha': image_sha},
                  {'path': 'assets/founder-shereef.webp', 'mode': '100644', 'type': 'blob', 'sha': None},
              ],
          })['sha']
          commit_sha = api('/git/commits', {
              'message': 'Publish approved full-resolution founder portrait and exact revised biography',
              'tree': tree_sha,
              'parents': [expected_head],
          })['sha']
          assert api('/git/ref/heads/main')['object']['sha'] == expected_head, 'Main changed before publication.'
          api('/git/refs/heads/main', {'sha': commit_sha, 'force': False}, method='PATCH')
          published = api('/contents/index.html?ref=' + commit_sha)
          assert published['sha'] == html_sha
          image = api('/contents/assets/founder-shereef-approved.png?ref=' + commit_sha)
          assert image['sha'] == image_sha
          print('PUBLISHED_COMMIT=' + commit_sha)
          print('APPROVED_IMAGE_SHA=' + image_sha)
          print('Image dimensions: 1122 x 1402; exact PNG bytes preserved.')
          print('Exact user biography installed; other page content unchanged.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Published approved founder portrait and exact biography.\n\nCommit: ' + commit_sha + '\n')
          PY
